<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1726"><title>Agenda semanal · Cartelera</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef4ff;background:#0f1726}*{box-sizing:border-box}body{margin:0;background:#0f1726}.shell{width:min(100%,680px);margin:auto;padding:12px 12px 38px}.top{position:sticky;top:0;z-index:10;background:#0f1726ee;backdrop-filter:blur(12px);padding:10px 0 14px;border-bottom:1px solid #334155}.brand h1{margin:0;font-size:1.45rem}.brand p{margin:5px 0 0;color:#9fb0c6}.nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin-top:15px}.nav button{height:46px;border:1px solid #475569;border-radius:12px;background:#1e293b;color:#fff;font-weight:850}.period{text-align:center;color:#9fb0c6;font-size:.82rem;margin:15px 0}.week{display:flex;flex-direction:column;gap:14px}.day{background:#172235;border:1px solid #334155;border-radius:17px;overflow:hidden;box-shadow:0 8px 24px #0206173d}.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px}.dayhead h2{margin:0;text-transform:capitalize;font-size:1.22rem}.dayhead time{display:block;color:#9fb0c6;font-size:.82rem;margin-top:3px}.status{border-radius:99px;padding:6px 9px;font-size:.72rem;font-weight:850;white-space:nowrap}.t0{color:#bae6fd;background:#0c4a6e}.t1{color:#bbf7d0;background:#14532d}.t2{color:#fef08a;background:#713f12}.t3{color:#fed7aa;background:#7c2d12}.t4{color:#fecdd3;background:#881337}.none{color:#cbd5e1;background:#334155}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 16px}.slot{display:flex;justify-content:space-between;gap:8px;border:1px solid #256f5a;background:#123c36;color:#d1fae5;border-radius:11px;padding:12px;font-size:.9rem;font-weight:750}.slot.busy{border-color:#4b5563;background:#252f40;color:#94a3b8}.events{border-top:1px solid #334155;padding:13px 16px 16px}.events h3{margin:0 0 8px;color:#93a4ba;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.event{border-left:4px solid #ec4899;background:#2c2036;border-radius:9px;padding:11px;margin-top:8px}.event b{display:block}.event span{font-size:.8rem;color:#cbd5e1}.empty{color:#7f90a5;padding:0 16px 16px;font-size:.86rem}.foot{text-align:center;color:#8292a7;font-size:.76rem;margin:20px 5px}.error{padding:18px;border:1px solid #7f1d1d;background:#451a1a;border-radius:12px;color:#fecaca}@media(max-width:520px){.shell{padding:8px 9px 32px}.brand h1{font-size:1.3rem}.slots{grid-template-columns:1fr;padding:0 14px 14px}.dayhead{padding:15px}.dayhead h2{font-size:1.14rem}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><h1>Agenda semanal</h1><p>Horarios disponibles y actividades públicas</p></div><nav class="nav"><button id="prev" aria-label="Semana anterior">←</button><button id="today">Esta semana</button><button id="next" aria-label="Semana siguiente">→</button></nav></header><div id="period" class="period"></div><section id="week" class="week" aria-live="polite"></section><p class="foot">Los horarios pueden cambiar. Confirma tu visita antes de acercarte.</p></main><script>
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];let data,weekStart=monday(new Date());function monday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function mins(x){let[a,b]=x.split(':').map(Number);return a*60+b}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function overlap(a,b,c,d){return a<d&&b>c}function temp(r){return r===0?0:r<=.25?1:r<=.5?2:r<1?3:4}function isFree(slot,date,day){let a=mins(slot[0]),b=mins(slot[1]),weekly=(data.blockedWeekly||[]).filter(x=>(x.days||[]).includes(day)),dated=(data.blockedDates||[]).filter(x=>x.date===date),visits=(data.occupiedVisits||[]).filter(x=>x.date===date);return !weekly.some(x=>overlap(a,b,mins(x.start),mins(x.end))&&!((data.publicWeekly||[]).some(p=>p.title&&p.start===x.start&&p.end===x.end&&(p.days||[]).includes(day))))&&!dated.some(x=>overlap(a,b,mins(x.start),mins(x.end))&&!((data.publicEvents||[]).some(p=>p.title&&p.date===date&&p.start===x.start&&p.end===x.end)))&&!visits.some(x=>overlap(a,b,mins(x.start),mins(x.start)+Number(x.duration||90)))}function render(){let end=addDays(weekStart,6);document.getElementById('period').textContent=`Semana del ${weekStart.toLocaleDateString('es',{day:'numeric',month:'long'})} al ${end.toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}`;document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{let d=addDays(weekStart,i),date=iso(d),day=d.getDay(),slots=(data.availability?.[day]||data.availability?.[String(day)]||[]),free=slots.filter(x=>isFree(x,date,day)),ratio=slots.length?1-free.length/slots.length:null,events=[...(data.publicWeekly||[]).filter(x=>(x.days||[]).includes(day)),...(data.publicEvents||[]).filter(x=>x.date===date)].sort((a,b)=>a.start.localeCompare(b.start)),status=ratio===null?'<span class="status none">Sin atención</span>':`<span class="status t${temp(ratio)}">${free.length}/${slots.length} libres</span>`;return `<article class="day"><div class="dayhead"><div><h2>${DAYS[day]}</h2><time>${d.toLocaleDateString('es',{day:'numeric',month:'long'})}</time></div>${status}</div>${slots.length?`<div class="slots">${slots.map(x=>{let ok=free.includes(x);return `<div class="slot ${ok?'':'busy'}"><span>${x[0]}–${x[1]}</span><strong>${ok?'Disponible':'Ocupado'}</strong></div>`}).join('')}</div>`:'<div class="empty">No hay horarios de visita habilitados.</div>'}${events.length?`<div class="events"><h3>Actividades para tener en cuenta</h3>${events.map(x=>`<div class="event"><b>${esc(x.title)}</b><span>${x.start}–${x.end}</span></div>`).join('')}</div>`:''}</article>`}).join('')}async function load(){try{let r=await fetch('cartelera-data.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();render()}catch{document.getElementById('week').innerHTML='<div class="error">No se pudo cargar la cartelera. Intenta nuevamente en unos minutos.</div>'}}document.getElementById('prev').onclick=()=>{weekStart=addDays(weekStart,-7);render();scrollTo(0,0)};document.getElementById('next').onclick=()=>{weekStart=addDays(weekStart,7);render();scrollTo(0,0)};document.getElementById('today').onclick=()=>{weekStart=monday(new Date());render();scrollTo(0,0)};load();
</script></body></html>
