<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1726"><title>IMPANQN · Agenda semanal</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef4ff;background:#0f1726}*{box-sizing:border-box}body{margin:0;background:#0f1726}.shell{width:min(100%,760px);margin:auto;padding:12px 12px 38px}.top{background:linear-gradient(145deg,#172235,#101a2a);border:1px solid #334155;border-radius:18px;padding:15px;box-shadow:0 10px 30px #02061755}.identity{display:flex;align-items:center;gap:14px}.logo{width:86px;height:86px;object-fit:contain;border-radius:14px;background:#05080d;border:1px solid #3b475b;flex:none}.identity h1{margin:0;font-size:1.6rem;letter-spacing:.02em}.identity p{margin:4px 0;color:#b5c3d6;font-size:.88rem;line-height:1.35}.legal{border-top:1px solid #334155;margin-top:13px;padding-top:10px;color:#8091a7;font-size:.7rem;line-height:1.35}
.month-layout{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:14px}.month-card,.verse-card{background:#172235;border:1px solid #334155;border-radius:18px;padding:13px}.month-head{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}.month-head button,.week-nav button{height:42px;border:1px solid #475569;border-radius:11px;background:#1e293b;color:#fff;font-weight:850}.month-title{text-align:center;text-transform:capitalize;font-size:1rem;font-weight:850}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}.dow{text-align:center;color:#8293a9;font-size:.68rem;font-weight:800;padding:3px}.calday{position:relative;min-height:43px;border:1px solid transparent;border-radius:10px;color:#e5edf8;background:#263347;font-weight:800}.calday.out{opacity:.35}.calday.today{outline:2px solid #93c5fd}.calday.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff38}.calday.c0{background:#31586b}.calday.c1{background:#466557}.calday.c2{background:#746f50}.calday.c3{background:#85604d}.calday.c4{background:#7a4d54}.calday.none{background:#293548;color:#94a3b8}.eventdot{position:absolute;right:5px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#c2789f}.legend{display:flex;flex-wrap:wrap;gap:7px 11px;margin-top:10px;color:#93a4ba;font-size:.67rem}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.verse-card{display:flex;flex-direction:column;justify-content:center;text-align:center;background:linear-gradient(160deg,#1b2a3d,#182334)}.verse-mark{font-family:Georgia,serif;font-size:2.6rem;line-height:.6;color:#7790aa}.verse-card blockquote{font-family:Georgia,serif;font-size:.94rem;line-height:1.45;margin:12px 0;color:#d8e0eb}.verse-card cite{color:#91a4ba;font-size:.75rem;font-style:normal}
.week-controls{position:sticky;top:0;z-index:10;background:#0f1726ee;backdrop-filter:blur(12px);padding:12px 0 10px}.week-nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}.period{text-align:center;color:#9fb0c6;font-size:.82rem;margin:10px 0 2px}.week{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}.day{background:#172235;border:1px solid #334155;border-radius:17px;overflow:hidden;box-shadow:0 8px 24px #0206173d;min-width:0}.day:first-child{grid-column:1/-1}.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:14px 14px 9px}.dayhead h2{margin:0;text-transform:capitalize;font-size:1.12rem}.dayhead time{display:block;color:#9fb0c6;font-size:.77rem;margin-top:3px}.status{border-radius:99px;padding:5px 8px;font-size:.68rem;font-weight:850;white-space:nowrap}.t0{color:#d4edf6;background:#31586b}.t1{color:#dbeadd;background:#466557}.t2{color:#f1e9c8;background:#746f50}.t3{color:#f0d8ca;background:#85604d}.t4{color:#efd3d7;background:#7a4d54}.temperature{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 14px 11px}.temperature i{height:6px;border-radius:99px;background:#2b3749}.temperature i.on:nth-child(1){background:#638596}.temperature i.on:nth-child(2){background:#6d8879}.temperature i.on:nth-child(3){background:#99906b}.temperature i.on:nth-child(4){background:#a77861}.temperature i.on:nth-child(5){background:#9a6269}.slots{display:grid;grid-template-columns:1fr;gap:7px;padding:0 14px 14px}.slot{display:flex;justify-content:space-between;align-items:center;gap:7px;border:1px solid #477866;background:#24483f;color:#d9eee6;border-radius:10px;padding:10px;font-size:.8rem;font-weight:750;text-decoration:none;cursor:pointer}.slot:hover,.slot:focus-visible{border-color:#75a893;background:#2d574c;outline:none}.slot.busy{border-color:#4b5563;background:#252f40;color:#94a3b8;cursor:default}.wa{font-size:.68rem;color:#bde5d5}.events{border-top:1px solid #334155;padding:11px 14px 14px}.events h3{margin:0 0 7px;color:#93a4ba;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}.event{border-left:4px solid #c2789f;background:#2c2634;border-radius:9px;padding:9px;margin-top:7px}.event b{display:block;font-size:.83rem}.event span{font-size:.72rem;color:#cbd5e1}.empty{color:#7f90a5;padding:0 14px 14px;font-size:.8rem}.foot{text-align:center;color:#8292a7;font-size:.76rem;line-height:1.5;margin:20px 5px}.error{padding:18px;border:1px solid #7f1d1d;background:#451a1a;border-radius:12px;color:#fecaca}
@media(max-width:520px){.shell{padding:8px 8px 30px}.top{padding:12px}.logo{width:70px;height:70px}.identity h1{font-size:1.3rem}.identity p{font-size:.76rem}.month-layout{gap:7px}.month-card,.verse-card{padding:8px;border-radius:14px}.month-head{grid-template-columns:34px 1fr 34px;gap:4px}.month-head button{height:35px}.month-title{font-size:.78rem}.calendar{gap:2px;margin-top:7px}.calday{min-height:34px;padding:0;font-size:.7rem;border-radius:7px}.dow{font-size:.58rem}.legend{gap:5px 7px;font-size:.55rem}.verse-mark{font-size:1.8rem}.verse-card blockquote{font-size:.7rem;line-height:1.35;margin:8px 0}.verse-card cite{font-size:.62rem}.week{gap:8px}.dayhead{padding:11px 10px 7px}.dayhead h2{font-size:.96rem}.dayhead time{font-size:.67rem}.status{font-size:.57rem;padding:4px 6px}.temperature{padding:0 10px 9px;gap:3px}.slots{padding:0 10px 11px;gap:6px}.slot{font-size:.69rem;padding:9px 7px;flex-direction:column;align-items:flex-start}.wa{font-size:.58rem}.empty{padding:0 10px 11px;font-size:.7rem}.events{padding:9px 10px 11px}.event b{font-size:.72rem}.event span{font-size:.64rem}}
</style></head><body><main class="shell"><header class="top"><div class="identity"><img id="logo" class="logo" alt="Logo de IMPANQN"><div><h1 id="name">IMPANQN</h1><p id="address"></p><p>Agenda semanal de visitas y actividades</p></div></div><div id="legal" class="legal"></div></header><div class="month-layout"><section class="month-card" aria-label="Calendario mensual"><div class="month-head"><button id="monthPrev" aria-label="Mes anterior">←</button><div id="monthTitle" class="month-title"></div><button id="monthNext" aria-label="Mes siguiente">→</button></div><div id="calendar" class="calendar"></div><div class="legend"><span><i style="background:#638596"></i>Libre</span><span><i style="background:#6d8879"></i>Suave</span><span><i style="background:#99906b"></i>Media</span><span><i style="background:#a77861"></i>Alta</span><span><i style="background:#9a6269"></i>Completo</span><span><i style="background:#c2789f"></i>Evento</span></div></section><aside class="verse-card"><div class="verse-mark">“</div><blockquote>Sobrellevad los unos las cargas de los otros.</blockquote><cite>Gálatas 6:2</cite></aside></div><section class="week-controls"><nav class="week-nav"><button id="prev" aria-label="Semana anterior">←</button><button id="today">Esta semana</button><button id="next" aria-label="Semana siguiente">→</button></nav><div id="period" class="period"></div></section><section id="week" class="week" aria-live="polite"></section><footer class="foot"><b id="footName">IMPANQN</b><br><span id="footAddress"></span><br><span id="footLegal"></span><br><br>Los horarios pueden cambiar. Solicita tu turno antes de acercarte.</footer></main><script>
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],DOW=['D','L','M','X','J','V','S'],PHONE='542995229598';let data,weekStart=sunday(new Date()),monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=iso(new Date());function sunday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x}function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function mins(x){let[a,b]=x.split(':').map(Number);return a*60+b}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function overlap(a,b,c,d){return a<d&&b>c}function temp(r){return r===0?0:r<=.25?1:r<=.5?2:r<.8?3:4}function slotsFor(day){return data.availability?.[day]||data.availability?.[String(day)]||[]}function publicEvents(date,day){return [...(data.publicWeekly||[]).filter(x=>(x.days||[]).includes(day)),...(data.publicEvents||[]).filter(x=>x.date===date)].sort((a,b)=>a.start.localeCompare(b.start))}function isFree(slot,date,day){let a=mins(slot[0]),b=mins(slot[1]),weekly=(data.blockedWeekly||[]).filter(x=>(x.days||[]).includes(day)),dated=(data.blockedDates||[]).filter(x=>x.date===date),visits=(data.occupiedVisits||[]).filter(x=>x.date===date);return !weekly.some(x=>overlap(a,b,mins(x.start),mins(x.end)))&&!dated.some(x=>overlap(a,b,mins(x.start),mins(x.end)))&&!visits.some(x=>overlap(a,b,mins(x.start),mins(x.start)+Number(x.duration||90)))&&!publicEvents(date,day).some(x=>overlap(a,b,mins(x.start),mins(x.end)))}
function mergedMinutes(items){let spans=items.map(x=>[Math.max(480,mins(x.start)),Math.min(1320,mins(x.end||x.start)+Number(x.duration||0))]).filter(x=>x[1]>x[0]).sort((a,b)=>a[0]-b[0]),total=0,last=null;for(let s of spans){if(!last)last=s;else if(s[0]<=last[1])last[1]=Math.max(last[1],s[1]);else{total+=last[1]-last[0];last=s}}return total+(last?last[1]-last[0]:0)}function loadLevel(date,day){let items=[...(data.blockedWeekly||[]).filter(x=>(x.days||[]).includes(day)),...(data.blockedDates||[]).filter(x=>x.date===date),...(data.occupiedVisits||[]).filter(x=>x.date===date).map(x=>({...x,end:null,duration:Number(x.duration||90)})),...publicEvents(date,day)];return temp(Math.min(1,mergedMinutes(items)/840))}function metrics(d){let date=iso(d),day=d.getDay(),slots=slotsFor(day),free=slots.filter(x=>isFree(x,date,day)),ratio=slots.length?1-free.length/slots.length:null;return{slots,free,ratio,t:ratio===null?null:temp(ratio),load:loadLevel(date,day)}}
function renderProfile(){let p=data.profile||{};document.getElementById('name').textContent=p.name||'IMPANQN';document.getElementById('logo').src=p.logo||'logo.png';document.getElementById('address').textContent=p.address||'';document.getElementById('legal').textContent=p.legal||'';document.getElementById('footName').textContent=p.name||'IMPANQN';document.getElementById('footAddress').textContent=p.address||'';document.getElementById('footLegal').textContent=p.legal||''}
function renderCalendar(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),lead=first.getDay(),start=addDays(first,-lead),today=iso(new Date()),cells=DOW.map(x=>`<div class="dow">${x}</div>`);for(let i=0;i<42;i++){let d=addDays(start,i),date=iso(d),met=metrics(d),events=publicEvents(date,d.getDay()),cls=met.t===null?'none':`c${met.t}`;cells.push(`<button class="calday ${cls} ${d.getMonth()===m?'':'out'} ${date===today?'today':''} ${date===selectedDate?'selected':''}" data-date="${date}" aria-label="${d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}: ${met.slots.length?`${met.free.length} de ${met.slots.length} turnos libres`:'sin atención'}">${d.getDate()}${events.length?'<i class="eventdot"></i>':''}</button>`)}document.getElementById('monthTitle').textContent=first.toLocaleDateString('es',{month:'long',year:'numeric'});document.getElementById('calendar').innerHTML=cells.join('')}
function waLink(d,slot){let day=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),msg=`Hola, Dios le bendiga. Quisiera solicitar un horario de consejería para el ${day}, de ${slot[0]} a ${slot[1]}. Mi nombre es: `;return `https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`}function heatBar(level){return `<div class="temperature" role="img" aria-label="Nivel gráfico de ocupación: ${level+1} de 5">${Array.from({length:5},(_,i)=>`<i class="${i<=level?'on':''}"></i>`).join('')}</div>`}
function renderWeek(){let end=addDays(weekStart,6);document.getElementById('period').textContent=`Semana del ${weekStart.toLocaleDateString('es',{day:'numeric',month:'long'})} al ${end.toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}`;document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{let d=addDays(weekStart,i),date=iso(d),day=d.getDay(),met=metrics(d),events=publicEvents(date,day),status=met.ratio===null?'<span class="status none">Sin atención</span>':`<span class="status t${met.t}">${met.free.length}/${met.slots.length} libres</span>`;return `<article class="day" data-date="${date}"><div class="dayhead"><div><h2>${DAYS[day]}</h2><time>${d.toLocaleDateString('es',{day:'numeric',month:'long'})}</time></div>${status}</div>${heatBar(met.load)}${met.slots.length?`<div class="slots">${met.slots.map(x=>{let ok=met.free.includes(x);return ok?`<a class="slot" href="${waLink(d,x)}" target="_blank" rel="noopener"><span>${x[0]}–${x[1]}</span><strong class="wa">Solicitar por WhatsApp</strong></a>`:`<div class="slot busy"><span>${x[0]}–${x[1]}</span><strong>Ocupado</strong></div>`}).join('')}</div>`:'<div class="empty">No hay horarios de atención habilitados.</div>'}${events.length?`<div class="events"><h3>Actividades para tener en cuenta</h3>${events.map(x=>`<div class="event"><b>${esc(x.title)}</b><span>${x.start}–${x.end}</span></div>`).join('')}</div>`:''}</article>`}).join('')}
function selectDate(date){selectedDate=date;let d=new Date(date+'T12:00:00');weekStart=sunday(d);monthCursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();renderWeek()}async function load(){try{let r=await fetch('cartelera-data.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();renderProfile();renderCalendar();renderWeek()}catch{document.getElementById('week').innerHTML='<div class="error">No se pudo cargar la cartelera. Intenta nuevamente en unos minutos.</div>'}}document.getElementById('calendar').onclick=e=>{let b=e.target.closest('[data-date]');if(b)selectDate(b.dataset.date)};document.getElementById('monthPrev').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);renderCalendar()};document.getElementById('monthNext').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);renderCalendar()};document.getElementById('prev').onclick=()=>{weekStart=addDays(weekStart,-7);selectedDate=iso(weekStart);monthCursor=new Date(weekStart.getFullYear(),weekStart.getMonth(),1);renderCalendar();renderWeek()};document.getElementById('next').onclick=()=>{weekStart=addDays(weekStart,7);selectedDate=iso(weekStart);monthCursor=new Date(weekStart.getFullYear(),weekStart.getMonth(),1);renderCalendar();renderWeek()};document.getElementById('today').onclick=()=>selectDate(iso(new Date()));load();
</script></body></html>
