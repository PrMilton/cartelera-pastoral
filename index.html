<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f1726"><title>IMPANQN · Agenda semanal</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef4ff;background:#0f1726}*{box-sizing:border-box}body{margin:0;background:#0f1726}.shell{width:min(100%,680px);margin:auto;padding:12px 12px 38px}.top{background:linear-gradient(145deg,#172235,#101a2a);border:1px solid #334155;border-radius:18px;padding:15px;box-shadow:0 10px 30px #02061755}.identity{display:flex;align-items:center;gap:14px}.logo{width:86px;height:86px;object-fit:contain;border-radius:14px;background:#05080d;border:1px solid #3b475b;flex:none}.identity h1{margin:0;font-size:1.6rem;letter-spacing:.02em}.identity p{margin:4px 0;color:#b5c3d6;font-size:.88rem;line-height:1.35}.legal{border-top:1px solid #334155;margin-top:13px;padding-top:10px;color:#8091a7;font-size:.7rem;line-height:1.35}.month-card{margin-top:14px;background:#172235;border:1px solid #334155;border-radius:18px;padding:13px}.month-head{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}.month-head button,.week-nav button{height:42px;border:1px solid #475569;border-radius:11px;background:#1e293b;color:#fff;font-weight:850}.month-title{text-align:center;text-transform:capitalize;font-size:1rem;font-weight:850}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:11px}.dow{text-align:center;color:#8293a9;font-size:.68rem;font-weight:800;padding:3px}.calday{position:relative;min-height:46px;border:1px solid transparent;border-radius:10px;color:#e5edf8;background:#263347;font-weight:800}.calday.out{opacity:.35}.calday.today{outline:2px solid #93c5fd}.calday.selected{border-color:#fff;box-shadow:0 0 0 2px #ffffff38}.calday.c0{background:#12445d}.calday.c1{background:#14532d}.calday.c2{background:#713f12}.calday.c3{background:#7c2d12}.calday.c4{background:#881337}.calday.none{background:#293548;color:#94a3b8}.eventdot{position:absolute;right:5px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#f472b6}.legend{display:flex;flex-wrap:wrap;gap:7px 11px;margin-top:10px;color:#93a4ba;font-size:.67rem}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.week-controls{position:sticky;top:0;z-index:10;background:#0f1726ee;backdrop-filter:blur(12px);padding:12px 0 10px}.week-nav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px}.period{text-align:center;color:#9fb0c6;font-size:.82rem;margin:10px 0 2px}.week{display:flex;flex-direction:column;gap:14px;margin-top:10px}.day{scroll-margin-top:105px;background:#172235;border:1px solid #334155;border-radius:17px;overflow:hidden;box-shadow:0 8px 24px #0206173d}.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px}.dayhead h2{margin:0;text-transform:capitalize;font-size:1.22rem}.dayhead time{display:block;color:#9fb0c6;font-size:.82rem;margin-top:3px}.status{border-radius:99px;padding:6px 9px;font-size:.72rem;font-weight:850;white-space:nowrap}.t0{color:#bae6fd;background:#0c4a6e}.t1{color:#bbf7d0;background:#14532d}.t2{color:#fef08a;background:#713f12}.t3{color:#fed7aa;background:#7c2d12}.t4{color:#fecdd3;background:#881337}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 16px}.slot{display:flex;justify-content:space-between;gap:8px;border:1px solid #256f5a;background:#123c36;color:#d1fae5;border-radius:11px;padding:12px;font-size:.9rem;font-weight:750}.slot.busy{border-color:#4b5563;background:#252f40;color:#94a3b8}.events{border-top:1px solid #334155;padding:13px 16px 16px}.events h3{margin:0 0 8px;color:#93a4ba;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.event{border-left:4px solid #ec4899;background:#2c2036;border-radius:9px;padding:11px;margin-top:8px}.event b{display:block}.event span{font-size:.8rem;color:#cbd5e1}.empty{color:#7f90a5;padding:0 16px 16px;font-size:.86rem}.foot{text-align:center;color:#8292a7;font-size:.76rem;line-height:1.5;margin:20px 5px}.error{padding:18px;border:1px solid #7f1d1d;background:#451a1a;border-radius:12px;color:#fecaca}@media(max-width:520px){.shell{padding:8px 9px 32px}.top{padding:12px}.logo{width:74px;height:74px}.identity h1{font-size:1.35rem}.identity p{font-size:.78rem}.slots{grid-template-columns:1fr;padding:0 14px 14px}.dayhead{padding:15px}.dayhead h2{font-size:1.14rem}.calday{min-height:43px;padding:2px}.month-card{padding:10px}}
</style></head><body><main class="shell"><header class="top"><div class="identity"><img id="logo" class="logo" alt="Logo de IMPANQN"><div><h1 id="name">IMPANQN</h1><p id="address"></p><p>Agenda semanal de visitas y actividades</p></div></div><div id="legal" class="legal"></div></header><section class="month-card" aria-label="Calendario mensual"><div class="month-head"><button id="monthPrev" aria-label="Mes anterior">←</button><div id="monthTitle" class="month-title"></div><button id="monthNext" aria-label="Mes siguiente">→</button></div><div id="calendar" class="calendar"></div><div class="legend"><span><i style="background:#38bdf8"></i>Disponible</span><span><i style="background:#22c55e"></i>Buena disponibilidad</span><span><i style="background:#eab308"></i>Intermedia</span><span><i style="background:#f97316"></i>Pocos turnos</span><span><i style="background:#ef4444"></i>Completo</span><span><i style="background:#f472b6"></i>Evento</span></div></section><section class="week-controls"><nav class="week-nav"><button id="prev" aria-label="Semana anterior">←</button><button id="today">Esta semana</button><button id="next" aria-label="Semana siguiente">→</button></nav><div id="period" class="period"></div></section><section id="week" class="week" aria-live="polite"></section><footer class="foot"><b id="footName">IMPANQN</b><br><span id="footAddress"></span><br><span id="footLegal"></span><br><br>Los horarios pueden cambiar. Confirma tu visita antes de acercarte.</footer></main><script>
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],DOW=['L','M','X','J','V','S','D'];let data,weekStart=monday(new Date()),monthCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),selectedDate=iso(new Date());function monday(d){let x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function mins(x){let[a,b]=x.split(':').map(Number);return a*60+b}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function overlap(a,b,c,d){return a<d&&b>c}function temp(r){return r===0?0:r<=.25?1:r<=.5?2:r<1?3:4}function slotsFor(day){return data.availability?.[day]||data.availability?.[String(day)]||[]}function publicEvents(date,day){return [...(data.publicWeekly||[]).filter(x=>(x.days||[]).includes(day)),...(data.publicEvents||[]).filter(x=>x.date===date)].sort((a,b)=>a.start.localeCompare(b.start))}function isFree(slot,date,day){let a=mins(slot[0]),b=mins(slot[1]),weekly=(data.blockedWeekly||[]).filter(x=>(x.days||[]).includes(day)),dated=(data.blockedDates||[]).filter(x=>x.date===date),visits=(data.occupiedVisits||[]).filter(x=>x.date===date);return !weekly.some(x=>overlap(a,b,mins(x.start),mins(x.end))&&!((data.publicWeekly||[]).some(p=>p.title&&p.start===x.start&&p.end===x.end&&(p.days||[]).includes(day))))&&!dated.some(x=>overlap(a,b,mins(x.start),mins(x.end))&&!((data.publicEvents||[]).some(p=>p.title&&p.date===date&&p.start===x.start&&p.end===x.end)))&&!visits.some(x=>overlap(a,b,mins(x.start),mins(x.start)+Number(x.duration||90)))}function metrics(d){let date=iso(d),day=d.getDay(),slots=slotsFor(day),free=slots.filter(x=>isFree(x,date,day)),ratio=slots.length?1-free.length/slots.length:null;return{slots,free,ratio,t:ratio===null?null:temp(ratio)}}
function renderProfile(){let p=data.profile||{};document.getElementById('name').textContent=p.name||'IMPANQN';document.getElementById('logo').src=p.logo||'assets/logo.png';document.getElementById('address').textContent=p.address||'';document.getElementById('legal').textContent=p.legal||'';document.getElementById('footName').textContent=p.name||'IMPANQN';document.getElementById('footAddress').textContent=p.address||'';document.getElementById('footLegal').textContent=p.legal||''}
function renderCalendar(){let y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),lead=(first.getDay()+6)%7,start=addDays(first,-lead),today=iso(new Date()),cells=DOW.map(x=>`<div class="dow">${x}</div>`);for(let i=0;i<42;i++){let d=addDays(start,i),date=iso(d),met=metrics(d),events=publicEvents(date,d.getDay()),cls=met.t===null?'none':`c${met.t}`;cells.push(`<button class="calday ${cls} ${d.getMonth()===m?'':'out'} ${date===today?'today':''} ${date===selectedDate?'selected':''}" data-date="${date}" aria-label="${d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}: ${met.slots.length?`${met.free.length} de ${met.slots.length} turnos libres`:'sin atención'}">${d.getDate()}${events.length?'<i class="eventdot"></i>':''}</button>`)}document.getElementById('monthTitle').textContent=first.toLocaleDateString('es',{month:'long',year:'numeric'});document.getElementById('calendar').innerHTML=cells.join('')}
function renderWeek(){let end=addDays(weekStart,6);document.getElementById('period').textContent=`Semana del ${weekStart.toLocaleDateString('es',{day:'numeric',month:'long'})} al ${end.toLocaleDateString('es',{day:'numeric',month:'long',year:'numeric'})}`;document.getElementById('week').innerHTML=Array.from({length:7},(_,i)=>{let d=addDays(weekStart,i),date=iso(d),day=d.getDay(),met=metrics(d),events=publicEvents(date,day),status=met.ratio===null?'<span class="status none">Sin atención</span>':`<span class="status t${met.t}">${met.free.length}/${met.slots.length} libres</span>`;return `<article class="day" data-date="${date}"><div class="dayhead"><div><h2>${DAYS[day]}</h2><time>${d.toLocaleDateString('es',{day:'numeric',month:'long'})}</time></div>${status}</div>${met.slots.length?`<div class="slots">${met.slots.map(x=>{let ok=met.free.includes(x);return `<div class="slot ${ok?'':'busy'}"><span>${x[0]}–${x[1]}</span><strong>${ok?'Disponible':'Ocupado'}</strong></div>`}).join('')}</div>`:'<div class="empty">No hay horarios de visita habilitados.</div>'}${events.length?`<div class="events"><h3>Actividades para tener en cuenta</h3>${events.map(x=>`<div class="event"><b>${esc(x.title)}</b><span>${x.start}–${x.end}</span></div>`).join('')}</div>`:''}</article>`}).join('')}
function selectDate(date){selectedDate=date;let d=new Date(date+'T12:00:00');weekStart=monday(d);monthCursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar();renderWeek();requestAnimationFrame(()=>document.querySelector(`.day[data-date="${date}"]`)?.scrollIntoView({behavior:'smooth',block:'start'}))}async function load(){try{let r=await fetch('cartelera-data.json',{cache:'no-store'});if(!r.ok)throw Error();data=await r.json();renderProfile();renderCalendar();renderWeek()}catch{document.getElementById('week').innerHTML='<div class="error">No se pudo cargar la cartelera. Intenta nuevamente en unos minutos.</div>'}}document.getElementById('calendar').onclick=e=>{let b=e.target.closest('[data-date]');if(b)selectDate(b.dataset.date)};document.getElementById('monthPrev').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);renderCalendar()};document.getElementById('monthNext').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);renderCalendar()};document.getElementById('prev').onclick=()=>{weekStart=addDays(weekStart,-7);selectedDate=iso(weekStart);monthCursor=new Date(weekStart.getFullYear(),weekStart.getMonth(),1);renderCalendar();renderWeek();scrollTo(0,document.querySelector('.week-controls').offsetTop)};document.getElementById('next').onclick=()=>{weekStart=addDays(weekStart,7);selectedDate=iso(weekStart);monthCursor=new Date(weekStart.getFullYear(),weekStart.getMonth(),1);renderCalendar();renderWeek();scrollTo(0,document.querySelector('.week-controls').offsetTop)};document.getElementById('today').onclick=()=>selectDate(iso(new Date()));load();
</script></body></html>
